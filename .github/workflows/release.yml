name: Versioned Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify-and-package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF_NAME !== 'v'+p.version)process.exit(1)"
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm run check
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/packaged-smoke.mjs
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: verified-windows-release
          path: |
            release/*setup.exe
            release/SHA256SUMS.txt
  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: verified-windows-release
          path: release
      - name: Publish verified unsigned preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" release/* --title "MNEMO $VERSION" --generate-notes --prerelease
